name: CD Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: [self-hosted, dev]

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Get build jar file info
        id: get_build_jar
        run: |
          BUILD_JAR_PATH=$(find ./build/libs -name "*.jar" ! -name "*plain.jar" | head -n 1)
          echo "BUILD_JAR_PATH=${BUILD_JAR_PATH}" >> $GITHUB_OUTPUT
          echo "BUILD_JAR_NAME=$(basename ${BUILD_JAR_PATH})" >> $GITHUB_OUTPUT

      - name: Stop old process
        run: |
          echo ">>> Stop old process..."
          PID=$(lsof -t -i:8080 || true)
          if [ -n "$PID" ]; then
            kill -15 $PID
            sleep 5
          fi

      - name: Run new process
        run: |
          echo ">>> Start new process..."
          DEPLOY_DIR="$HOME/app"
          mkdir -p $DEPLOY_DIR
          
          JAR_NAME="${{ steps.get_build_jar.outputs.BUILD_JAR_NAME }}"
          cp "${{ steps.get_build_jar.outputs.BUILD_JAR_PATH }}" "$DEPLOY_DIR/$JAR_NAME"
          
          LOG_PATH="$DEPLOY_DIR/application.log"
          setsid java -jar -Duser.timezone=Asia/Seoul "$DEPLOY_DIR/$JAR_NAME" > $LOG_PATH 2>&1 &
          
          sleep 5
          NEW_PID=$(lsof -t -i:8080 || true)
          if [ -n "$NEW_PID" ]; then
            echo "Application started successfully with PID: $NEW_PID"
          else
            echo "Error: Application failed to start"
            tail -n 50 $LOG_PATH
            exit 1
          fi
